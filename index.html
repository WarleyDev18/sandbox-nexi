<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Regras de Negócio · Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    /* ===== Tokens ===== */
    :root {
      --bg: #0f1115;
      --surface-1: #171a21;
      --surface-2: #1f232c;
      --border-subtle: rgba(255, 255, 255, 0.070);
      --border-default: rgba(255, 255, 255, 0.110);
      --text-primary: #f1f3f7;
      --text-secondary: #aab1bf;
      --text-muted: #8a92a3;

      --accent: #3b82f6;  --accent-soft: rgba(59, 130, 246, 0.10);   --accent-border: rgba(59, 130, 246, 0.30);
      --info: #14b8a6;    --info-soft: rgba(20, 184, 166, 0.10);    --info-border: rgba(20, 184, 166, 0.28);
      --warning: #f59e0b; --warning-soft: rgba(245, 158, 11, 0.10); --warning-border: rgba(245, 158, 11, 0.28);
      --rose: #ec4899;    --rose-soft: rgba(236, 72, 153, 0.10);   --rose-border: rgba(236, 72, 153, 0.28);
      --violet: #8b5cf6;  --violet-soft: rgba(139, 92, 246, 0.10); --violet-border: rgba(139, 92, 246, 0.28);
      --cyan: #06b6d4;    --cyan-soft: rgba(6, 182, 212, 0.10);    --cyan-border: rgba(6, 182, 212, 0.28);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --text-xs: 12px; --text-sm: 13.5px; --text-base: 14.5px; --text-lg: 18px; --text-xl: 22px;

      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
      --radius-sm: 6px; --radius-card: 14px; --radius-full: 999px;

      --shadow-card: 0 0 0 1px rgba(255,255,255,0.045), 0 2px 8px rgba(0,0,0,0.28), 0 12px 36px rgba(0,0,0,0.22);
      --shadow-card-hover: 0 0 0 1px rgba(255,255,255,0.090), 0 4px 14px rgba(0,0,0,0.40), 0 22px 60px rgba(0,0,0,0.34);
      --card-edge: inset 0 1px 0 rgba(255,255,255,0.06);
      --gradient-divider: linear-gradient(90deg, var(--border-default), transparent);
      --dot-grid: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.022) 1px, transparent 0);
      --transition-base: 180ms ease;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(900px 500px at 10% -10%, var(--accent-soft), transparent 60%),
        radial-gradient(700px 400px at 100% 0%, var(--violet-soft), transparent 60%),
        var(--dot-grid);
      background-size: auto, auto, 22px 22px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Topbar ===== */
    .topbar {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-4) var(--space-6);
      background: rgba(23, 26, 33, 0.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar__logo { color: var(--accent); display: flex; }
    .topbar__title { font-weight: 700; font-size: var(--text-lg); }
    .topbar__sep { width: 1px; height: 18px; background: var(--border-default); }
    .topbar__breadcrumb { color: var(--text-muted); font-size: var(--text-sm); }

    .content { max-width: 1200px; margin: 0 auto; padding: var(--space-6); }

    /* ===== Alerta ===== */
    .alert {
      display: flex; align-items: flex-start; gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-card);
      background: var(--info-soft); border: 1px solid var(--info-border);
      color: var(--text-secondary); font-size: var(--text-sm);
      margin-bottom: var(--space-6);
    }
    .alert svg { color: var(--info); flex: none; margin-top: 1px; }

    /* ===== Seção ===== */
    .section__head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .section__head h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; }
    .section__line { flex: 1; height: 1px; background: var(--gradient-divider); }
    .section__count { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }

    /* ===== Grade e cards ===== */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }
    .card {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--surface-1);
      border-radius: var(--radius-card);
      box-shadow: var(--card-edge), var(--shadow-card);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--card-edge), var(--shadow-card-hover); }
    .card::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
      background: var(--cor); opacity: .7;
    }
    .card::after { /* glow de canto, cor como sussurro */
      content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -60px;
      background: radial-gradient(circle, var(--cor-soft), transparent 70%);
      pointer-events: none;
    }
    .card__header { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-5) var(--space-3); }
    .card__num {
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 500;
      color: var(--text-muted); border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); padding: 2px 6px;
    }
    .card__icon {
      width: 34px; height: 34px; display: grid; place-items: center; flex: none;
      border-radius: 10px; color: var(--cor); background: var(--cor-soft); border: 1px solid var(--cor-border);
    }
    .card__title { font-weight: 600; font-size: var(--text-base); line-height: 1.3; }
    .card__body { padding: 0 var(--space-5) var(--space-5); display: flex; flex-direction: column; flex: 1; }
    .card__desc { margin: 0 0 var(--space-4); color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.55; }
    .card__why {
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text-muted); font-size: var(--text-xs); line-height: 1.5;
    }
    .card__why strong { color: var(--text-secondary); font-weight: 600; }
    .card__foot { margin-top: auto; padding-top: var(--space-4); }

    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600;
      color: var(--cor); background: var(--cor-soft); border: 1px solid var(--cor-border);
    }

    /* cores por categoria */
    .c-violet  { --cor: var(--violet);  --cor-soft: var(--violet-soft);  --cor-border: var(--violet-border); }
    .c-info    { --cor: var(--info);    --cor-soft: var(--info-soft);    --cor-border: var(--info-border); }
    .c-warning { --cor: var(--warning); --cor-soft: var(--warning-soft); --cor-border: var(--warning-border); }
    .c-rose    { --cor: var(--rose);    --cor-soft: var(--rose-soft);    --cor-border: var(--rose-border); }
    .c-cyan    { --cor: var(--cyan);    --cor-soft: var(--cyan-soft);    --cor-border: var(--cyan-border); }

    .empty { padding: var(--space-8); text-align: center; color: var(--text-muted); }

    /* entrada em cascata — só transform/opacity, 1× */
    @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .anim-in { animation: pageIn 420ms cubic-bezier(.2,.7,.2,1) both; }
    @media (prefers-reduced-motion: reduce) { .anim-in { animation: none; } .card:hover { transform: none; } }

    @media (max-width: 640px) {
      .topbar { padding: var(--space-3) var(--space-4); flex-wrap: wrap; }
      .topbar__sep { display: none; }
      .topbar__breadcrumb { width: 100%; }
      .content { padding: var(--space-4); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="topbar__logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
    </span>
    <span class="topbar__title">Regras de Negócio</span>
    <div class="topbar__sep"></div>
    <div class="topbar__breadcrumb">Regras de exemplo de uma loja fictícia</div>
  </header>

  <main class="content">
    <div class="alert anim-in">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 8v4M10 14h.01"/></svg>
      Regras de exemplo. Edite o array REGRAS para usar as suas.
    </div>

    <section>
      <div class="section__head">
        <h2>Regras de negócio</h2>
        <span class="section__line"></span>
        <span class="section__count" id="cTotal">0 regras</span>
      </div>
      <div class="grid" id="listaRegras"></div>
    </section>
  </main>

  <script>
  (function () {
    "use strict";
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

    /* Ícones Lucide (MIT) — só os usados nesta tela */
    var ICONES = {
      "send": '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      "shield-check": '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
      "target": '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      "phone": '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
      "clipboard-list": '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>'
    };
    var ico = function (n, s) {
      s = s || 18;
      return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONES[n] || "") + '</svg>';
    };

    /* ===== As 5 regras — editar aqui ===== */
    var REGRAS = [
      { titulo: "Frete grátis acima de R$ 200", icone: "send", cor: "violet", tag: "Vendas",
        desc: "Pedidos a partir de R$ 200 não pagam entrega dentro da cidade.",
        porque: "Aumenta o ticket médio sem dar desconto direto." },
      { titulo: "Troca em até 30 dias", icone: "shield-check", cor: "info", tag: "Pós-venda",
        desc: "Produto sem uso e com nota fiscal pode ser trocado em até 30 dias.",
        porque: "Dá segurança para o cliente comprar pela primeira vez." },
      { titulo: "Desconto máximo de 10%", icone: "target", cor: "warning", tag: "Preço",
        desc: "O vendedor concede até 10%. Acima disso, só com aprovação do gerente.",
        porque: "Protege a margem sem travar a negociação." },
      { titulo: "Retorno ao cliente em até 24h", icone: "phone", cor: "rose", tag: "Atendimento",
        desc: "Toda mensagem ou ligação recebe resposta em até 24 horas úteis.",
        porque: "Cliente sem resposta procura o concorrente." },
      { titulo: "Cadastro completo antes da venda a prazo", icone: "clipboard-list", cor: "cyan", tag: "Crédito",
        desc: "Venda parcelada só com CPF, endereço e telefone confirmados.",
        porque: "Reduz inadimplência e facilita a cobrança." }
    ];

    function cardRegra(r, i) {
      var num = ("0" + (i + 1)).slice(-2);
      return '<article class="card c-' + esc(r.cor) + ' anim-in" style="animation-delay:' + (80 + i * 60) + 'ms">' +
        '<div class="card__header">' +
          '<span class="card__num">' + num + '</span>' +
          '<span class="card__icon">' + ico(r.icone) + '</span>' +
          '<span class="card__title">' + esc(r.titulo) + '</span>' +
        '</div>' +
        '<div class="card__body">' +
          '<p class="card__desc">' + esc(r.desc) + '</p>' +
          '<div class="card__why"><strong>Por quê:</strong> ' + esc(r.porque) + '</div>' +
          '<div class="card__foot"><span class="badge">' + esc(r.tag) + '</span></div>' +
        '</div>' +
      '</article>';
    }

    function renderizar() {
      var el = document.getElementById("listaRegras");
      if (!REGRAS.length) {
        el.innerHTML = '<div class="empty">Nenhuma regra cadastrada.</div>';
        return;
      }
      el.innerHTML = REGRAS.map(cardRegra).join("");
      document.getElementById("cTotal").textContent = REGRAS.length + " regras";
    }

    document.addEventListener("DOMContentLoaded", renderizar);
  }());
  </script>
</body>
</html>
